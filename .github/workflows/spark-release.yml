name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.95.0'
          components: clippy,rustfmt
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-deny
      - name: Install release signing executable
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
      - run: cargo deny --no-default-features --features appliance check
      - run: make lint-spark
      - run: make test
      - run: make test-client
  build:
    needs: contract
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install ziglang==0.16.0
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-auditable,cargo-zigbuild
      - run: cargo auditable zigbuild --locked --release --target ${{ matrix.target }} --bin sparkplane
      - name: Collect client
        run: |
          mkdir -p target/release-assets
          install -m 0555 target/${{ matrix.target }}/release/sparkplane target/release-assets/sparkplane-${{ matrix.target }}
      - name: Build ARM64 appliance
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo auditable zigbuild --locked --release --target aarch64-unknown-linux-gnu --features appliance --bin sparkplane
          scripts/package-spark-release.sh target/aarch64-unknown-linux-gnu/release/sparkplane target/release-assets/appliance
          cargo metadata --locked --format-version 1 > target/release-assets/appliance/cargo-metadata.json
          cargo tree --locked --features appliance -e features > target/release-assets/appliance/resolved-features.txt
          cargo tree --locked -d > target/release-assets/appliance/duplicate-dependencies.txt
          rg -n 'unsafe|links =|build =' Cargo.toml Cargo.lock src > target/release-assets/appliance/native-unsafe-build-inventory.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparkplane-${{ matrix.target }}
          path: target/release-assets/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sparkplane-*
          merge-multiple: true
          path: release
      - name: Install release signing executable
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign
      - name: Sign and publish
        env:
          SPARKPLANE_MINISIGN_SECRET_KEY: ${{ secrets.SPARKPLANE_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.SPARKPLANE_MINISIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sign-spark-release.sh release
          cd release
          gh release create "$GITHUB_REF_NAME" sparkplane-* SHA256SUMS SHA256SUMS.minisig minisign.pub --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
