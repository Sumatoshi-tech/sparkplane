[workspace]
members = [".", "crates/sparkplane-core", "crates/sparkplane-ipc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
ulid = { version = "1", features = ["serde"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "thread", "system"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
metrics = "0.24"
tempfile = "3"
sparkplane-core = { path = "crates/sparkplane-core", version = "=0.1.0" }
sparkplane-ipc = { path = "crates/sparkplane-ipc", version = "=0.1.0" }

[package]
name = "sparkplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent, signed DGX Spark inference appliance and workstation CLI"
repository = "https://github.com/Sumatoshi-tech/sparkplane"
publish = false

[features]
default = []
appliance = ["dep:axum", "dep:axum-server", "dep:hmac", "dep:governor", "dep:rcgen", "dep:rusqlite", "dep:rusqlite_migration", "dep:rustls", "dep:secrecy", "dep:tower", "dep:utoipa", "dep:x509-parser", "dep:bollard", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:hf-hub", "dep:image", "dep:arc-swap", "dep:sparkplane-ipc", "dep:tempfile"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
ulid.workspace = true
rustix.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sparkplane-core.workspace = true
sparkplane-ipc = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2"
nix = { version = "0.29", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
walkdir = "2"
sd-notify = "0.5"
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
tower = { version = "0.5", default-features = false, features = ["limit", "timeout", "util"], optional = true }
utoipa = { version = "5", default-features = false, features = ["macros"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"], optional = true }
hmac = { version = "0.12", optional = true }
secrecy = { version = "0.10", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
x509-parser = { version = "0.18", default-features = false, features = ["verify"], optional = true }
rusqlite = { version = "0.40.0", default-features = false, features = ["backup", "bundled"], optional = true }
rusqlite_migration = { version = "2.6.0", default-features = false, optional = true }
governor = { version = "0.10.4", default-features = false, features = ["dashmap", "std"], optional = true }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
arc-swap = { version = "1", optional = true }

[dev-dependencies]
tempfile.workspace = true
minisign = "0.9"
which = "7"

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
